[project]
name = "sail-marinex-ml-service"
version = "2.0.0"
description = "SAIL MARINEX Intelligent Freight Forecasting and SHAP Explainability Engine"
authors = [{ name = "SAIL MARINEX ML Team", email = "ai-core@marinex.sail.in" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.4.0",
    "shap>=0.45.0",
    "optuna>=3.6.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
